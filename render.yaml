services:
  - type: web
    name: paper-checker-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: paper_checker
      - key: GROQ_API_KEYS
        sync: false
      - key: GROQ_MODELS
        value: llama-3.3-70b-versatile,llama-3.1-8b-instant,gemma2-9b-it
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODELS
        value: gemini-2.5-flash,gemini-2.0-flash,gemini-2.0-flash-lite
      - key: OPENROUTER_API_KEYS
        sync: false
      - key: OPENROUTER_VISION_MODELS
        value: google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free,nvidia/nemotron-nano-12b-v2-vl:free
      - key: CORS_ORIGINS
        value: http://localhost:4200
